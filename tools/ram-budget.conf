# Static internal RAM budget per target, in bytes of .data + .bss (tools/ram-budget.sh).
# Raising a number needs the reason in the commit message and a board boot log showing
# "MEM internal_free=" still >= CONFIG_ARCANA_INTERNAL_RAM_WARN_BYTES (AGENTS.md R10).
#
# esp32s3 100000: a product from this template failed on an S3 at 116,681 B (.data+.bss)
#   (6.9 KB free at boot, BLE + Wi-Fi allocations failed) and was healthy at 67,913 B
#   (69 KB free at boot, 39.8 KB minimum). The template itself is ~92 KB with the SdFat
#   scratch in PSRAM. 100 KB leaves ~8 KB of growth before the gate asks for a decision and
#   stays ~16 KB below the measured failure point.
# esp32 108000: no PSRAM; the dram0 segment is 124,580 B and the template uses ~101 KB.
#   108 KB keeps >= 16.5 KB of the segment for heap and allows ~7 KB of growth.
#
# target   max .data+.bss bytes
esp32      108000
esp32s3    100000
