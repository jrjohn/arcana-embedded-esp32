syntax = "proto3";
package arcana;

message CmdRequest {
  uint32 func = 1;       // FuncCode enum
  bytes  payload = 2;    // Command-specific params (max 128 bytes)
}

message CmdResponse {
  uint32 func = 1;
  uint32 status = 2;     // 0 = OK
  bytes  payload = 3;    // Command-specific data (max 256 bytes)
}
