sonar.projectKey=esp32-app
sonar.projectName=ESP32 App
sonar.projectVersion=1.0

# Sources to analyze (testable platform-independent code)
sonar.sources=main
sonar.tests=Tests

# Explicitly list CXX file suffixes (sonar-cxx 2.x needs this)
sonar.cxx.file.suffixes=.cpp,.cxx,.cc,.c++,.c,.hpp,.hxx,.hh,.h++,.h

# Include directories for CXX analysis
sonar.cxx.includeDirectories=\
  main,\
  main/service,\
  main/service/impl,\
  main/transport/ble,\
  main/transport/mqtt,\
  main/transport/wifi,\
  main/db/arcanats,\
  main/db/arcanats/ats,\
  main/db/arcanats/security,\
  main/db/arcanats/port,\
  main/command,\
  main/command/commands,\
  main/command/codec,\
  main/command/security,\
  main/view,\
  main/view/main,\
  main/driver,\
  main/core/event,\
  main/core/log,\
  main/core/model,\
  Tests/mocks

# Coverage: Cobertura XML (sonar-cxx 2.x; lcov converted via lcov_cobertura)
sonar.cxx.cobertura.reportPaths=coverage.xml

# Exclusions — only HAL drivers, vendor code, and generated code.
# Security-critical code (CryptoEngine, KeyExchangeManager, CommandCodec) and
# business logic (Observable, FrameCodec, Commands) are KEPT in analysis even
# if not yet covered by tests — coverage gap is intentional and tracked.
sonar.exclusions=\
  main/transport/ble/BleGap.cpp,\
  main/transport/ble/BleGattServer.cpp,\
  main/transport/ble/BleGattClient.cpp,\
  main/transport/ble/BleService.cpp,\
  main/transport/ble/BleTransportServiceImpl.cpp,\
  main/transport/ble/BleGap.hpp,\
  main/transport/ble/BleGattServer.hpp,\
  main/transport/ble/BleGattClient.hpp,\
  main/transport/ble/BleService.hpp,\
  main/transport/ble/impl/**,\
  main/transport/mqtt/MqttTransportServiceImpl.cpp,\
  main/transport/mqtt/impl/**,\
  main/transport/wifi/WifiServiceImpl.cpp,\
  main/transport/wifi/impl/**,\
  main/service/impl/AtsStorageServiceImpl.cpp,\
  main/service/impl/AtsStorageServiceImpl.hpp,\
  main/service/impl/OtaServiceImpl.cpp,\
  main/service/impl/OtaServiceImpl.hpp,\
  main/service/impl/IoServiceImpl.cpp,\
  main/service/impl/IoServiceImpl.hpp,\
  main/service/impl/LedServiceImpl.cpp,\
  main/service/impl/LedServiceImpl.hpp,\
  main/service/impl/LcdServiceImpl.cpp,\
  main/service/impl/LcdServiceImpl.hpp,\
  main/service/impl/SdBenchmarkServiceImpl.cpp,\
  main/service/impl/SdBenchmarkServiceImpl.hpp,\
  main/service/impl/SensorServiceImpl.cpp,\
  main/service/impl/SensorServiceImpl.hpp,\
  main/service/impl/TimerServiceImpl.cpp,\
  main/service/impl/TimerServiceImpl.hpp,\
  main/service/impl/DiagnosticServiceImpl.cpp,\
  main/service/impl/DiagnosticServiceImpl.hpp,\
  main/service/impl/CommandBridgeServiceImpl.cpp,\
  main/service/impl/CommandBridgeServiceImpl.hpp,\
  main/service/SdBenchmarkService.hpp,\
  main/driver/RgbLed.cpp,\
  main/driver/RgbLed.hpp,\
  main/driver/Ssd1306.cpp,\
  main/driver/Ssd1306.hpp,\
  main/driver/DhtSensor.cpp,\
  main/driver/DhtSensor.hpp,\
  main/core/event/ObservableSensor.cpp,\
  main/core/event/ObservableSensor.hpp,\
  main/command/codec/arcana_cmd.pb.c,\
  main/command/codec/arcana_cmd.pb.h,\
  main/App.cpp,\
  main/AppContainer.cpp,\
  main/AppContainer.hpp,\
  main/Kconfig.projbuild,\
  build/**,\
  managed_components/**,\
  Tests/build/**

# Exclude tests and mocks from coverage metric
sonar.coverage.exclusions=\
  Tests/**,\
  **/mocks/**

# Fix: sonarapple plugin claims *.h for ObjC — override to only match ObjC files
sonar.lang.patterns.objc=**/*.m,**/*.mm

sonar.scm.disabled=true
sonar.sourceEncoding=UTF-8
