sonar.projectKey=esp32-app
sonar.projectName=ESP32 App
sonar.projectVersion=1.0

# Sources to analyze (testable platform-independent code)
sonar.sources=components,main
sonar.tests=Tests

# Explicitly list CXX file suffixes (sonar-cxx 2.x needs this)
sonar.cxx.file.suffixes=.cpp,.cxx,.cc,.c++,.c,.hpp,.hxx,.hh,.h++,.h

# Include directories for CXX analysis
sonar.cxx.includeDirectories=\
  components/CommandService/include,\
  components/ObservableSensor/include,\
  Tests/mocks

# Coverage: Cobertura XML (sonar-cxx 2.x; lcov converted via lcov_cobertura)
sonar.cxx.cobertura.reportPaths=coverage.xml

# Exclusions — only HAL drivers, vendor code, and generated code.
# Security-critical code (CryptoEngine, KeyExchangeManager, CommandCodec) and
# business logic (Observable, FrameCodec, Commands) are KEPT in analysis even
# if not yet covered by tests — coverage gap is intentional and tracked.
sonar.exclusions=\
  components/BleService/src/BleGap.cpp,\
  components/BleService/src/BleGattServer.cpp,\
  components/BleService/src/BleGattClient.cpp,\
  components/BleService/src/BleService.cpp,\
  components/BleService/src/BleTransportServiceImpl.cpp,\
  components/BleService/include/BleGap.hpp,\
  components/BleService/include/BleGattServer.hpp,\
  components/BleService/include/BleGattClient.hpp,\
  components/BleService/include/impl/**,\
  components/MqttService/MqttTransportServiceImpl.cpp,\
  components/MqttService/include/impl/**,\
  components/WifiService/WifiServiceImpl.cpp,\
  components/WifiService/include/impl/**,\
  components/AtsStorageService/AtsStorageServiceImpl.cpp,\
  components/AtsStorageService/include/impl/**,\
  components/OtaService/OtaServiceImpl.cpp,\
  components/OtaService/include/impl/**,\
  components/IoService/IoServiceImpl.cpp,\
  components/IoService/include/impl/**,\
  components/RgbLed/RgbLed.cpp,\
  components/RgbLed/LedServiceImpl.cpp,\
  components/RgbLed/include/impl/**,\
  components/OledDisplay/Ssd1306.cpp,\
  components/OledDisplay/LcdServiceImpl.cpp,\
  components/OledDisplay/include/impl/**,\
  components/SdBenchmarkService/SdBenchmarkServiceImpl.cpp,\
  components/SdBenchmarkService/include/impl/**,\
  components/ObservableSensor/DhtSensor.cpp,\
  components/ObservableSensor/include/DhtSensor.hpp,\
  components/ObservableSensor/ObservableSensor.cpp,\
  components/ObservableSensor/SensorServiceImpl.cpp,\
  components/ObservableSensor/include/impl/**,\
  components/ObservableSensor/examples/**,\
  components/CommandService/src/arcana_cmd.pb.c,\
  components/CommandService/include/arcana_cmd.pb.h,\
  main/**,\
  build/**,\
  managed_components/**,\
  Tests/build/**

# Exclude tests and mocks from coverage metric
sonar.coverage.exclusions=\
  Tests/**,\
  **/mocks/**

# Fix: sonarapple plugin claims *.h for ObjC — override to only match ObjC files
sonar.lang.patterns.objc=**/*.m,**/*.mm

sonar.scm.disabled=true
sonar.sourceEncoding=UTF-8
